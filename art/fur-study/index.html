<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:, "><title>PlayGrounds • Squishy fur study</title>
<style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#514b58;font:15px system-ui}main{height:100svh;min-height:780px;display:grid;grid-template-rows:auto 1fr auto}header{text-align:center;padding:24px 16px 0}h1{font-size:22px;margin:0 0 6px;font-weight:650}p{margin:0;color:#77717d;font-size:13px}.stage{min-height:0;position:relative}canvas{display:block;width:100%;height:100%;touch-action:pan-y}#fallback{position:absolute;inset:20%;text-align:center}footer{padding:12px 18px 22px;margin:auto;width:min(620px,100%)}.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:10px 0}button,select{font:inherit;border:1px solid #ded8df;background:#fff;border-radius:24px;padding:10px 16px;color:inherit;cursor:pointer}button:hover{background:#fff1e9}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #867bc5;outline-offset:3px}button[aria-pressed=true]{background:#f4e9fb;border-color:#b9a8d7}label{font-size:13px;display:flex;gap:8px;align-items:center}input[type=range]{width:120px;accent-color:#bc87ae}.note{text-align:center;font-size:11px;color:#817988}@media(max-width:480px){header{padding-top:16px}h1{font-size:19px}main{min-height:900px}button,select{padding:9px 12px}}</style>
<main><header><h1>PlayGrounds · Core four</h1><p id="designName">Dot version</p><p id="designDescription">Same fur. Different personalities.</p></header><div class="stage"><canvas aria-label="Interactive fluffy character. Use the Squish button to compress it."></canvas><p id="fallback" hidden>3D is unavailable here. This study needs WebGL2; all controls remain labeled.</p></div><footer><div class="row"><label>Design <select id="model"><option value="dot">Dot version</option><option value="rabbit">Animal · Rabbit</option><option value="turtle">Animal · Turtle</option><option value="bird">Animal · Bird</option></select></label><label>Accessories <select id="accessory"><option value="signature">Signature look</option><option value="headphones">Over-ear headphones</option><option value="none">None</option></select></label></div><div class="row"><button data-palette="peach" aria-pressed="true">Peach</button><button data-palette="blue" aria-pressed="false">Sky</button><button data-palette="lilac" aria-pressed="false">Lilac</button></div><div class="row"><button id="squish">Squish ✨</button><button id="still" aria-pressed="false">Still mode</button><label>Detail <select id="quality"><option value="64">Portrait</option><option value="32">Balanced</option><option value="16">Light</option></select></label></div><div class="row"><label>Fluff <input id="fluff" type="range" min="0.06" max="0.24" step="0.01" value="0.16"></label><label>Turn <input id="turn" type="range" min="-100" max="100" value="0"></label></div><p class="note">Original shader experiment • synthetic character, not a live agent • tap or press Squish</p></footer></main><script type="module" src="study.js"></script></html>
