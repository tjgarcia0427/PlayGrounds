name: Playgrounds CI

# Runs the full verification suite on every push to main and every pull request.
# Neither agent's word for "all tests pass" is needed — the diff proves it.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publish ownership regression
        run: python3 mvp/test_ownership.py

      - name: MCP credential transport regressions
        run: python3 mvp/test_mcp_transport.py

      - name: Core v0.2 suite (23 tests, self-contained)
        run: python3 mvp/test_v02.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verifier identity regressions
        run: python3 mvp/test_verifier_identity.py

      - name: Audit regressions
        run: python3 mvp/test_audit.py

      - name: Mini-games engine + HTTP API regressions
        run: python3 mvp/test_games.py

      - name: Dual-space regressions
        run: python3 mvp/test_world.py

      - name: Dual-space dashboard behavior
        run: node mvp/test_world_dashboard.js

      - name: 3D layout and module checks
        run: |
          node mvp/test_campus.mjs
          node mvp/test_expanded.mjs
          node mvp/test_interactions.mjs
          node mvp/test_playful.mjs
          node mvp/test_personality.mjs
          node mvp/test_plush_art.mjs
          node --check mvp/assets/campus.js

      - name: Install pinned browser QA tools
        run: npm ci --prefix mvp/browser-qa --ignore-scripts --no-audit --no-fund

      - name: Chrome art material sample
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node mvp/browser-qa/art-check.mjs

      - name: Upload art comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: art-chrome-visuals
          path: mvp/browser-qa/artifacts/art-*
          if-no-files-found: warn

      - name: Chrome 3D visual QA
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node mvp/browser-qa/check.mjs

      - name: Upload labeled Chrome screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campus-chrome-visuals
          path: mvp/browser-qa/artifacts/
          if-no-files-found: warn

      - name: Dashboard JavaScript syntax
        run: python3 mvp/check_dashboard.py

      - name: Start protocol server for MCP test
        run: |
          export PLAYGROUNDS_STATE_PATH="$RUNNER_TEMP/ci-state.json"
          export PLAYGROUNDS_PORT=8471
          nohup python3 mvp/server.py > "$RUNNER_TEMP/ci-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/ci-server.pid"
          for i in $(seq 1 30); do
            if python3 -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8471/api/policy', timeout=2)" 2>/dev/null; then
              echo "server ready"; exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/ci-server.log"
          exit 1

      - name: MCP end-to-end test (28 tools, full agent loop)
        env:
          PLAYGROUNDS_BASE: http://127.0.0.1:8471
        run: python3 mvp/test_mcp.py

      - name: Stop test server
        if: always()
        run: kill "$(cat "$RUNNER_TEMP/ci-server.pid")" 2>/dev/null || true

  plush-art:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --prefix mvp/browser-qa --ignore-scripts --no-audit --no-fund
      - name: Chrome plush art and crowd QA
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node mvp/browser-qa/plush-check.mjs
      - name: Upload original-model art evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plush-art-chrome
          path: mvp/browser-qa/artifacts/plush-*
          if-no-files-found: warn

  mcp-room-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 525ab16ba523e0d69909fc56f5e31054210c901e
          path: .qa-room-backend
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Real room backend with authenticated stdio MCP clients
        env:
          ROOM_BACKEND_ROOT: ${{ github.workspace }}/.qa-room-backend
        run: python3 mvp/test_mcp_rooms.py
